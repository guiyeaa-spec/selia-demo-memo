<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#4b1755" />
  <title>Serena — Demo de bienestar digital</title>
  <style>
:root{
  --ink:#251829; --muted:#736a75; --purple:#4b1755; --purple2:#6e2677; --pink:#f5b7db; --pink2:#ffd9ec;
  --blue:#123f79; --blue2:#d7e9f7; --paper:#fffafc; --card:#ffffff; --line:#eadfe8; --green:#dff2e9; --shadow:0 18px 45px rgba(46,24,49,.12);
  --radius:26px;
}
*{box-sizing:border-box} html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f1f6;color:var(--ink)}
button,input,select,textarea{font:inherit} button{cursor:pointer}
.app-shell{min-height:100vh;background:linear-gradient(145deg,#f9f3f7,#f0e8f2 55%,#eaf3f8)}
.demo-note{position:sticky;top:0;z-index:60;background:#231328;color:#fff;padding:8px 18px;text-align:center;font-size:12px;letter-spacing:.15px}
.desktop{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 32px)}
.sidebar{padding:24px 18px;border-right:1px solid rgba(75,23,85,.08);background:rgba(255,255,255,.72);backdrop-filter:blur(18px);position:sticky;top:32px;height:calc(100vh - 32px)}
.brand{display:flex;align-items:center;gap:11px;font-weight:900;font-size:24px;letter-spacing:-1px;color:var(--purple);margin:4px 8px 28px}.brand-mark{width:38px;height:38px;border-radius:14px;background:linear-gradient(145deg,var(--purple),#a84d98 55%,var(--pink));display:grid;place-items:center;color:#fff;font-weight:900}
.nav{display:flex;flex-direction:column;gap:7px}.nav button{border:0;background:transparent;border-radius:14px;padding:12px 14px;text-align:left;color:#544b56;font-weight:700;display:flex;align-items:center;gap:10px}.nav button:hover,.nav button.active{background:#f1e4ef;color:var(--purple)}
.sidebar-card{margin-top:28px;background:linear-gradient(160deg,var(--purple),#762775);color:#fff;padding:18px;border-radius:22px}.sidebar-card h4{margin:0 0 6px}.sidebar-card p{font-size:13px;opacity:.84;line-height:1.45}.sidebar-card button{border:0;border-radius:12px;padding:10px 12px;background:#fff;color:var(--purple);font-weight:800;width:100%}
.content{padding:28px 34px 70px;max-width:1280px;width:100%;margin:auto}.topbar{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}.topbar h1{margin:0;font-size:32px;letter-spacing:-1.2px}.eyebrow{font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--purple2)}
.profile-chip{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);padding:7px 10px 7px 7px;border-radius:999px}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;background:linear-gradient(135deg,#173e77,#c35c9f)}
.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:20px;margin-bottom:22px}.hero-main{background:linear-gradient(125deg,#4b1755 0%,#6e266f 58%,#d873b9 130%);color:#fff;padding:30px;border-radius:32px;min-height:250px;position:relative;overflow:hidden}.hero-main:after{content:"";position:absolute;right:-70px;bottom:-120px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,#ffc8e8 0 35%,rgba(255,255,255,.11) 36% 62%,transparent 63%)}.hero-main h2{font-family:Georgia,serif;font-size:42px;max-width:630px;line-height:1.02;margin:6px 0 12px}.hero-main p{max-width:620px;line-height:1.55;opacity:.9}.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:850}.btn.primary{background:#fff;color:var(--purple)}.btn.secondary{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25)}.btn.purple{background:var(--purple);color:#fff}.btn.light{background:#f6edf5;color:var(--purple)}
.mood-card{background:#0e3b74;color:#fff;padding:24px;border-radius:32px;display:flex;flex-direction:column;justify-content:space-between}.moods{display:flex;gap:8px;flex-wrap:wrap}.mood{width:44px;height:44px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.12);border-radius:14px;display:grid;place-items:center;font-size:22px}.mood.selected{background:#fff;transform:translateY(-3px)}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.card{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 8px 30px rgba(49,29,49,.045)}.card h3,.card h4{margin-top:0}.card-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.link{color:var(--purple);font-weight:800;font-size:13px;background:none;border:0}
.appointment{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px}.photo{width:64px;height:64px;border-radius:18px;background:linear-gradient(145deg,#a8d8ec,#f4b4d2);display:grid;place-items:center;font-size:26px}.meta{font-size:13px;color:var(--muted);line-height:1.5}.pill{display:inline-flex;align-items:center;border-radius:999px;background:#f4e8f2;color:var(--purple);padding:6px 10px;font-size:12px;font-weight:800}.status{background:var(--green);color:#245c44}
.quick{display:flex;align-items:center;gap:13px}.quick .icon{width:48px;height:48px;border-radius:15px;background:#f1e4ef;display:grid;place-items:center;font-size:21px}.quick b{display:block;margin-bottom:4px}.quick small{color:var(--muted)}
.section{margin-top:25px}.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:14px}.section-head h2{margin:0;font-size:24px}.section-head p{margin:4px 0 0;color:var(--muted)}
.specialist{overflow:hidden;padding:0}.specialist-cover{height:135px;background:linear-gradient(140deg,#cbe7f3,#efbad9 62%,#7e2b74)}.specialist-body{padding:18px}.rating{font-size:13px;color:#6c5e6e}.tags{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.tag{background:#f7eff6;color:#5b315e;padding:6px 9px;border-radius:999px;font-size:11px;font-weight:750}.price{font-size:22px;font-weight:900;color:var(--purple)}
.program{min-height:170px;position:relative;overflow:hidden}.program:nth-child(1){background:#ffd8eb}.program:nth-child(2){background:#dcecf8}.program:nth-child(3){background:#efe2f1}.program:after{content:"";position:absolute;width:110px;height:110px;border-radius:50%;right:-24px;bottom:-26px;background:rgba(255,255,255,.55)}
.list{display:flex;flex-direction:column;gap:11px}.list-row{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:16px;background:#fff}.row-icon{width:42px;height:42px;flex:0 0 auto;border-radius:14px;background:#f2e7f1;display:grid;place-items:center}.grow{flex:1}.muted{color:var(--muted)}.small{font-size:13px}
.match-wrap{max-width:760px;margin:30px auto}.progress{height:8px;border-radius:999px;background:#eadfea;overflow:hidden}.progress span{height:100%;display:block;background:linear-gradient(90deg,var(--purple),#d46cae);transition:.3s}.question{margin:22px 0}.question h2{font-family:Georgia,serif;font-size:35px;margin-bottom:8px}.options{display:grid;gap:10px}.option{padding:16px;border:1px solid var(--line);border-radius:18px;background:#fff;text-align:left;font-weight:750}.option:hover,.option.selected{border-color:#b57ab4;background:#f9edf7;color:var(--purple)}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.day{padding:12px 6px;text-align:center;border-radius:14px;background:#faf5f9;border:1px solid var(--line)}.day.active{background:var(--purple);color:#fff}.slot-grid{display:flex;gap:8px;flex-wrap:wrap}.slot{border:1px solid var(--line);background:#fff;padding:10px 12px;border-radius:12px}.slot.active{background:#f1e4ef;border-color:#c491c1;color:var(--purple);font-weight:800}
.journal textarea{width:100%;min-height:160px;border:1px solid var(--line);border-radius:18px;padding:15px;resize:vertical;background:#fffafd}.journal-entry{padding:14px 0;border-bottom:1px solid var(--line)}
.chat{display:grid;grid-template-columns:300px 1fr;min-height:620px;overflow:hidden;padding:0}.chat-list{border-right:1px solid var(--line);padding:16px}.chat-main{display:flex;flex-direction:column}.chat-head{padding:18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.messages{flex:1;padding:20px;display:flex;flex-direction:column;gap:10px;background:#fffafd}.bubble{max-width:72%;padding:12px 14px;border-radius:16px;line-height:1.45}.bubble.them{background:#f0e5ef;align-self:flex-start}.bubble.me{background:var(--purple);color:#fff;align-self:flex-end}.chat-input{padding:14px;border-top:1px solid var(--line);display:flex;gap:8px}.chat-input input{flex:1;border:1px solid var(--line);border-radius:14px;padding:12px}
.video-modal{position:fixed;inset:0;background:rgba(20,11,22,.88);z-index:99;display:grid;place-items:center;padding:20px}.video-stage{width:min(980px,96vw);height:min(650px,82vh);background:linear-gradient(145deg,#243044,#111923);border-radius:28px;position:relative;overflow:hidden}.video-person{position:absolute;inset:40px;display:grid;place-items:center;color:#fff;font-size:28px}.video-person .big-avatar{width:180px;height:180px;border-radius:50%;background:linear-gradient(135deg,#99d5e9,#e48bbd);display:grid;place-items:center;font-size:70px}.self-view{position:absolute;right:22px;top:22px;width:180px;height:125px;border-radius:18px;background:linear-gradient(135deg,#5f2f6c,#ca72a5);display:grid;place-items:center;color:#fff}.video-controls{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:12px}.vc{width:52px;height:52px;border:0;border-radius:50%;background:#fff;color:#2a1a2c;font-size:20px}.vc.end{background:#d33b54;color:#fff}
.profile-grid{display:grid;grid-template-columns:320px 1fr;gap:18px}.profile-big{text-align:center}.avatar-big{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:34px;font-weight:900;margin:8px auto 14px;background:linear-gradient(135deg,#123f79,#e185bc)}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field label{display:block;font-size:12px;font-weight:850;color:#5c4e5e;margin:0 0 6px}.field input,.field select{width:100%;border:1px solid var(--line);background:#fff;border-radius:13px;padding:11px 12px}
.bottom-nav{display:none}
.toast{position:fixed;right:22px;bottom:22px;background:#231328;color:#fff;padding:13px 16px;border-radius:14px;box-shadow:var(--shadow);z-index:110;animation:in .2s ease-out}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(max-width:900px){.desktop{display:block}.sidebar{display:none}.content{padding:20px 14px 90px}.topbar{align-items:flex-start}.topbar h1{font-size:26px}.profile-chip span{display:none}.hero{grid-template-columns:1fr}.hero-main{min-height:300px;padding:24px}.hero-main h2{font-size:36px}.grid-3,.grid-2,.profile-grid,.form-grid{grid-template-columns:1fr}.chat{grid-template-columns:1fr}.chat-list{display:none}.bottom-nav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,255,255,.94);border-top:1px solid var(--line);backdrop-filter:blur(16px);padding:8px 6px max(8px,env(safe-area-inset-bottom))}.bottom-nav button{border:0;background:transparent;font-size:11px;color:#665b67;display:flex;flex-direction:column;gap:3px;align-items:center}.bottom-nav button.active{color:var(--purple);font-weight:900}.appointment{grid-template-columns:auto 1fr}.appointment .appt-action{grid-column:1/-1}.calendar{gap:4px}.day{padding:9px 2px;font-size:12px}.video-stage{height:78vh}.self-view{width:120px;height:90px}}

</style>
</head>
<body>
  <div id="app"></div>
  <script>
const state = {
  route: 'home',
  mood: localStorage.getItem('serenaMood') || '🙂',
  matchStep: 0,
  matchAnswers: [],
  selectedSlot: '10:30',
  journal: JSON.parse(localStorage.getItem('serenaJournal') || '[]'),
  chat: [
    {who:'them', text:'Hola Memo, ¿cómo te has sentido desde nuestra última sesión?'},
    {who:'me', text:'Con bastante carga de trabajo, pero mejor organizado.'},
    {who:'them', text:'Perfecto. Podemos revisar una estrategia breve para separar urgencia de importancia.'}
  ],
  video:false
};

const navItems = [
  ['home','⌂','Inicio'],['specialists','♙','Especialistas'],['match','✦','Mi match'],['appointments','◷','Citas'],['resources','◉','Bienestar'],['journal','✎','Diario'],['chat','◌','Chat'],['profile','⚙','Perfil']
];

const specialists = [
  {name:'Catalina Zapata', role:'Psicóloga clínica', rating:'4.9', exp:'8 años', tags:['Ansiedad','Estrés','Autoestima'], price:'US$ 28', emoji:'👩🏻‍⚕️'},
  {name:'Laura Méndez', role:'Psicóloga · TCC', rating:'4.8', exp:'6 años', tags:['Burnout','Relaciones','Sueño'], price:'US$ 25', emoji:'👩🏽‍💼'},
  {name:'Andrés Molina', role:'Coach emocional', rating:'4.9', exp:'9 años', tags:['Liderazgo','Hábitos','Propósito'], price:'US$ 22', emoji:'👨🏻‍💼'}
];

function layout(content,title='Tu espacio de bienestar',eyebrow='SERENA · DEMO FUNCIONAL'){
  return `<div class="app-shell">
    <div class="demo-note">Prototipo independiente inspirado en patrones públicos de apps de bienestar. No afiliado con Selia.</div>
    <div class="desktop">
      <aside class="sidebar">
        <div class="brand"><div class="brand-mark">S</div>serena</div>
        <div class="nav">${navItems.map(n=>`<button class="${state.route===n[0]?'active':''}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join('')}</div>
        <div class="sidebar-card"><h4>¿Necesitas orientación?</h4><p>Responde unas preguntas y encuentra un especialista compatible contigo.</p><button onclick="go('match')">Comenzar matching</button></div>
      </aside>
      <main class="content">
        <div class="topbar"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1></div><div class="profile-chip" onclick="go('profile')"><div class="avatar">M</div><span><b>Memo</b><br><small class="muted">Cuenta demo</small></span></div></div>
        ${content}
      </main>
    </div>
    <nav class="bottom-nav">${[['home','⌂','Inicio'],['specialists','♙','Explorar'],['appointments','◷','Citas'],['resources','◉','Bienestar'],['profile','⚙','Perfil']].map(n=>`<button class="${state.route===n[0]?'active':''}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join('')}</nav>
    ${state.video ? videoModal():''}
  </div>`;
}

function home(){
 return layout(`
 <section class="hero"><div class="hero-main"><div class="eyebrow" style="color:#ffd4ea">BIENVENIDO, MEMO</div><h2>Un espacio para sentirte mejor, a tu ritmo.</h2><p>Conecta con especialistas, organiza tus sesiones y usa herramientas prácticas de bienestar desde un mismo lugar.</p><div class="hero-actions"><button class="btn primary" onclick="go('match')">Encontrar mi especialista</button><button class="btn secondary" onclick="go('resources')">Explorar recursos</button></div></div>
 <div class="mood-card"><div><div class="eyebrow" style="color:#cfe3ff">CHECK-IN DIARIO</div><h3>¿Cómo te sientes hoy?</h3><p style="opacity:.78">Registrar tu estado ayuda a ver patrones con el tiempo.</p></div><div class="moods">${['😞','😕','😐','🙂','😄'].map(m=>`<button class="mood ${state.mood===m?'selected':''}" onclick="setMood('${m}')">${m}</button>`).join('')}</div></div></section>
 <section class="grid-2"><div class="card"><div class="card-title"><h3>Tu próxima cita</h3><button class="link" onclick="go('appointments')">Ver agenda</button></div><div class="appointment"><div class="photo">👩🏻‍⚕️</div><div><b>Catalina Zapata</b><div class="meta">Psicología individual · Hoy, 18:30<br><span class="pill status">Confirmada</span></div></div><div class="appt-action"><button class="btn purple" onclick="startVideo()">Iniciar videollamada</button></div></div></div>
 <div class="card"><div class="card-title"><h3>Continuar tu proceso</h3><span class="pill">Semana 3</span></div><div class="quick"><div class="icon">✦</div><div><b>Programa de manejo del estrés</b><small>2 de 5 prácticas completadas</small></div></div><div class="progress" style="margin-top:16px"><span style="width:40%"></span></div></div></section>
 <section class="section"><div class="section-head"><div><h2>Accesos rápidos</h2><p>Todo lo que necesitas en pocos toques.</p></div></div><div class="grid-3"><div class="card quick" onclick="go('chat')"><div class="icon">💬</div><div><b>Hablar con mi especialista</b><small>Chat privado de demostración</small></div></div><div class="card quick" onclick="go('journal')"><div class="icon">✎</div><div><b>Escribir en mi diario</b><small>Registra ideas y emociones</small></div></div><div class="card quick" onclick="go('resources')"><div class="icon">◉</div><div><b>Respirar y meditar</b><small>Recursos rápidos de bienestar</small></div></div></div></section>
 <section class="section"><div class="section-head"><div><h2>Especialistas recomendados</h2><p>Opciones compatibles con tus objetivos.</p></div><button class="link" onclick="go('specialists')">Ver todos</button></div><div class="grid-3">${specialistCards()}</div></section>
 `,'Hola, Memo 👋');
}
function specialistCards(){return specialists.map((s,i)=>`<article class="card specialist"><div class="specialist-cover" style="display:grid;place-items:center;font-size:56px">${s.emoji}</div><div class="specialist-body"><div class="rating">★ ${s.rating} · ${s.exp}</div><h3 style="margin:5px 0">${s.name}</h3><div class="muted small">${s.role}</div><div class="tags">${s.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div><div style="display:flex;justify-content:space-between;align-items:center"><div><span class="price">${s.price}</span><small class="muted"> / sesión</small></div><button class="btn light" onclick="go('appointments');toast('Seleccionaste a ${s.name}')">Ver horarios</button></div></div></article>`).join('')}

function specialistsPage(){return layout(`<div class="card" style="margin-bottom:16px"><div class="form-grid"><div class="field"><label>¿Qué quieres trabajar?</label><select><option>Ansiedad y estrés</option><option>Relaciones</option><option>Burnout</option><option>Autoestima</option></select></div><div class="field"><label>Tipo de acompañamiento</label><select><option>Psicología</option><option>Coaching</option><option>Psiquiatría</option><option>Nutrición</option></select></div></div></div><div class="grid-3">${specialistCards()}</div>`,'Explora especialistas','DIRECTORIO');}

const matchQuestions=[
 {q:'¿Qué te gustaría trabajar primero?', opts:['Estrés o ansiedad','Relaciones y comunicación','Autoestima y confianza','Cambios importantes','No estoy seguro/a']},
 {q:'¿Qué estilo de acompañamiento prefieres?',opts:['Práctico y con ejercicios','Profundo y reflexivo','Directo y orientado a metas','Flexible, según el momento']},
 {q:'¿Qué disponibilidad te resulta mejor?',opts:['Mañanas','Tardes','Noches','Fines de semana']},
 {q:'¿Qué valoras más en un especialista?',opts:['Experiencia clínica','Calidez y escucha','Metodología clara','Disponibilidad rápida']}
];
function matchPage(){
 if(state.matchStep>=matchQuestions.length){return layout(`<div class="match-wrap"><div class="card" style="text-align:center;padding:34px"><div style="font-size:48px">✨</div><div class="eyebrow">TU MATCH ESTÁ LISTO</div><h2 style="font-family:Georgia,serif;font-size:38px">Encontramos 3 perfiles compatibles</h2><p class="muted">Basado en tus respuestas de esta demostración, estos especialistas encajan mejor con el estilo y disponibilidad que marcaste.</p><div class="grid-3" style="text-align:left;margin-top:22px">${specialistCards()}</div><button class="btn purple" style="margin-top:20px" onclick="resetMatch()">Repetir matching</button></div></div>`,'Tu matching','MATCH PERSONALIZADO')}
 const item=matchQuestions[state.matchStep];
 const selected=state.matchAnswers[state.matchStep];
 return layout(`<div class="match-wrap"><div class="progress"><span style="width:${((state.matchStep+1)/matchQuestions.length)*100}%"></span></div><div class="question"><div class="eyebrow">PASO ${state.matchStep+1} DE ${matchQuestions.length}</div><h2>${item.q}</h2><p class="muted">Elige la opción que más se acerque a lo que buscas.</p></div><div class="options">${item.opts.map((o,i)=>`<button class="option ${selected===i?'selected':''}" onclick="chooseMatch(${i})">${o}</button>`).join('')}</div><div style="display:flex;justify-content:space-between;margin-top:18px"><button class="btn light" onclick="prevMatch()" ${state.matchStep===0?'disabled':''}>Atrás</button><button class="btn purple" onclick="nextMatch()" ${selected===undefined?'disabled':''}>${state.matchStep===matchQuestions.length-1?'Ver resultados':'Continuar'}</button></div></div>`,'Encuentra tu especialista ideal','MATCH PERSONALIZADO');
}

function appointments(){return layout(`<div class="grid-2"><div class="card"><div class="card-title"><h3>Selecciona una fecha</h3><span class="pill">Septiembre 2026</span></div><div class="calendar">${['L','M','X','J','V','S','D'].map(x=>`<div class="muted small">${x}</div>`).join('')}${Array.from({length:28},(_,i)=>`<button class="day ${i+1===15?'active':''}">${i+1}</button>`).join('')}</div></div><div class="card"><h3>Horarios disponibles</h3><p class="muted small">Catalina Zapata · Psicología individual</p><div class="slot-grid">${['08:00','09:30','10:30','15:00','17:30','18:30','20:00'].map(s=>`<button class="slot ${state.selectedSlot===s?'active':''}" onclick="selectSlot('${s}')">${s}</button>`).join('')}</div><div style="margin-top:22px;padding:16px;background:#faf1f8;border-radius:16px"><b>Resumen</b><div class="meta" style="margin-top:7px">15 de septiembre · ${state.selectedSlot}<br>Videollamada · 50 min<br>US$ 28</div></div><button class="btn purple" style="width:100%;margin-top:14px" onclick="toast('Cita de demostración confirmada para las ${state.selectedSlot}')">Confirmar cita</button></div></div><div class="section"><div class="card"><div class="card-title"><h3>Próximas sesiones</h3></div><div class="list"><div class="list-row"><div class="photo">👩🏻‍⚕️</div><div class="grow"><b>Catalina Zapata</b><div class="meta">Hoy · 18:30 · Videollamada</div></div><span class="pill status">Confirmada</span></div><div class="list-row"><div class="photo">👨🏻‍💼</div><div class="grow"><b>Andrés Molina</b><div class="meta">24 sep · 09:30 · Videollamada</div></div><span class="pill">Próxima</span></div></div></div></div>`,'Agenda tus sesiones','CITAS');}

function resources(){return layout(`<div class="grid-3"><div class="card program"><div class="eyebrow">ANSIEDAD</div><h3>Recupera la calma</h3><p class="small">Respiración, regulación emocional y prácticas de 5 minutos.</p><button class="link" onclick="toast('Abriendo programa de ansiedad')">Comenzar →</button></div><div class="card program"><div class="eyebrow">MINDFULNESS</div><h3>Volver al presente</h3><p class="small">Audios breves para bajar revoluciones y recuperar foco.</p><button class="link" onclick="toast('Reproduciendo meditación demo')">Escuchar →</button></div><div class="card program"><div class="eyebrow">BURNOUT</div><h3>Recuperar energía</h3><p class="small">Detecta señales de agotamiento y crea límites sostenibles.</p><button class="link" onclick="toast('Abriendo programa de burnout')">Explorar →</button></div></div><section class="section grid-2"><div class="card"><div class="card-title"><h3>Meditaciones guiadas</h3><span class="pill">5–12 min</span></div><div class="list"><div class="list-row"><div class="row-icon">▶</div><div class="grow"><b>Respirar antes de una reunión</b><div class="meta">5 min · foco y calma</div></div><button class="link" onclick="toast('Audio demo iniciado')">Play</button></div><div class="list-row"><div class="row-icon">▶</div><div class="grow"><b>Cerrar el día</b><div class="meta">8 min · descanso</div></div><button class="link" onclick="toast('Audio demo iniciado')">Play</button></div><div class="list-row"><div class="row-icon">▶</div><div class="grow"><b>Soltar tensión</b><div class="meta">10 min · cuerpo</div></div><button class="link" onclick="toast('Audio demo iniciado')">Play</button></div></div></div><div class="card"><h3>Test de bienestar</h3><p class="muted">Una demostración breve de autoevaluación no clínica.</p><div class="list"><div class="list-row"><div class="row-icon">✓</div><div class="grow"><b>Estrés percibido</b><div class="meta">2 min</div></div><button class="link" onclick="toast('Test demo iniciado')">Empezar</button></div><div class="list-row"><div class="row-icon">☾</div><div class="grow"><b>Calidad de sueño</b><div class="meta">3 min</div></div><button class="link" onclick="toast('Test demo iniciado')">Empezar</button></div></div></div></section>`,'Bienestar para tu día a día','RECURSOS');}

function journal(){return layout(`<div class="grid-2"><div class="card journal"><div class="eyebrow">NUEVA ENTRADA</div><h3>¿Qué tienes en mente?</h3><textarea id="journalText" placeholder="Escribe libremente. En esta demo el texto se guarda solo en tu navegador local."></textarea><button class="btn purple" style="margin-top:10px" onclick="saveJournal()">Guardar entrada</button></div><div class="card"><h3>Tu check-in</h3><div style="font-size:54px">${state.mood}</div><p class="muted">Tu estado registrado hoy. Puedes cambiarlo desde Inicio.</p><button class="btn light" onclick="go('home')">Actualizar estado</button></div></div><section class="section"><div class="card"><div class="card-title"><h3>Entradas recientes</h3><span class="pill">${state.journal.length} guardadas</span></div>${state.journal.length?state.journal.map(e=>`<div class="journal-entry"><b>${e.date}</b><p style="margin-bottom:0">${escapeHtml(e.text)}</p></div>`).join(''):'<p class="muted">Todavía no escribiste ninguna entrada.</p>'}</div></section>`,'Tu diario personal','JOURNALING');}

function chatPage(){return layout(`<div class="card chat"><aside class="chat-list"><h3>Conversaciones</h3><div class="list-row"><div class="photo" style="width:48px;height:48px">👩🏻‍⚕️</div><div><b>Catalina Zapata</b><div class="meta">En línea</div></div></div></aside><section class="chat-main"><div class="chat-head"><div><b>Catalina Zapata</b><div class="meta">Psicología individual · En línea</div></div><button class="btn light" onclick="startVideo()">📹 Videollamada</button></div><div class="messages" id="messages">${state.chat.map(m=>`<div class="bubble ${m.who}">${escapeHtml(m.text)}</div>`).join('')}</div><div class="chat-input"><input id="chatInput" placeholder="Escribe un mensaje..." onkeydown="if(event.key==='Enter')sendChat()"><button class="btn purple" onclick="sendChat()">Enviar</button></div></section></div>`,'Mensajes','CHAT SEGURO');}

function profile(){return layout(`<div class="profile-grid"><div class="card profile-big"><div class="avatar-big">M</div><h2 style="margin-bottom:4px">Memo</h2><div class="muted">Cuenta de demostración</div><div class="tags" style="justify-content:center"><span class="tag">Bienestar</span><span class="tag">Estrés</span><span class="tag">Productividad</span></div></div><div class="card"><h3>Preferencias personales</h3><div class="form-grid"><div class="field"><label>Nombre</label><input value="Memo"></div><div class="field"><label>Zona horaria</label><input value="GMT-3 · Paraguay"></div><div class="field"><label>Idioma</label><select><option>Español</option><option>English</option></select></div><div class="field"><label>Recordatorios</label><select><option>30 min antes</option><option>1 hora antes</option><option>1 día antes</option></select></div></div><button class="btn purple" style="margin-top:16px" onclick="toast('Preferencias guardadas en la demo')">Guardar cambios</button></div></div><section class="section grid-2"><div class="card"><h3>Privacidad</h3><p class="muted small">Este prototipo no envía información a servidores. Los datos demo del diario y estado de ánimo se almacenan únicamente en localStorage del navegador.</p></div><div class="card"><h3>Soporte</h3><p class="muted small">Módulo preparado para integrar tickets, FAQs, contactos y centro de ayuda.</p><button class="btn light" onclick="toast('Centro de ayuda demo')">Abrir ayuda</button></div></section>`,'Tu perfil','CUENTA');}

function videoModal(){return `<div class="video-modal"><div class="video-stage"><div class="video-person"><div style="text-align:center"><div class="big-avatar">👩🏻‍⚕️</div><h2>Catalina Zapata</h2><p style="opacity:.7">Videollamada de demostración</p></div></div><div class="self-view">Tu cámara</div><div class="video-controls"><button class="vc" onclick="toast('Micrófono alternado')">🎙</button><button class="vc" onclick="toast('Cámara alternada')">📹</button><button class="vc end" onclick="endVideo()">☎</button></div></div></div>`}

function render(){
 let html='';
 if(state.route==='home')html=home();
 if(state.route==='specialists')html=specialistsPage();
 if(state.route==='match')html=matchPage();
 if(state.route==='appointments')html=appointments();
 if(state.route==='resources')html=resources();
 if(state.route==='journal')html=journal();
 if(state.route==='chat')html=chatPage();
 if(state.route==='profile')html=profile();
 document.getElementById('app').innerHTML=html;
 window.scrollTo({top:0,behavior:'instant'});
}
function go(r){state.route=r;render()}
function setMood(m){state.mood=m;localStorage.setItem('serenaMood',m);render();toast('Estado de ánimo actualizado')}
function chooseMatch(i){state.matchAnswers[state.matchStep]=i;render()}
function nextMatch(){if(state.matchAnswers[state.matchStep]===undefined)return;state.matchStep++;render()}
function prevMatch(){if(state.matchStep>0){state.matchStep--;render()}}
function resetMatch(){state.matchStep=0;state.matchAnswers=[];render()}
function selectSlot(s){state.selectedSlot=s;render()}
function saveJournal(){const el=document.getElementById('journalText');const t=(el?.value||'').trim();if(!t)return toast('Escribe algo antes de guardar');state.journal.unshift({date:new Date().toLocaleDateString('es-PY',{day:'2-digit',month:'short',year:'numeric'}),text:t});localStorage.setItem('serenaJournal',JSON.stringify(state.journal));render();toast('Entrada guardada localmente')}
function sendChat(){const el=document.getElementById('chatInput');const t=(el?.value||'').trim();if(!t)return;state.chat.push({who:'me',text:t});state.chat.push({who:'them',text:'Gracias por compartirlo. Lo retomamos en nuestra próxima sesión.'});render();setTimeout(()=>{const m=document.getElementById('messages');if(m)m.scrollTop=m.scrollHeight},0)}
function startVideo(){state.video=true;render()}
function endVideo(){state.video=false;render();toast('Videollamada finalizada')}
function toast(msg){const old=document.querySelector('.toast');if(old)old.remove();const d=document.createElement('div');d.className='toast';d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),2300)}
function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
render();

</script>
</body>
</html>
